# PROJECT_DNA.yaml - Canonical architecture blueprint

version: "statedd-template-v4"
schema_version: "1.0"

product:
  name: inherited_project_unknown
  one_sentence: "Ambiguous inherited repo used to validate honest bootstrap under conflict."

truth_rules:
  repo_roles:
    downstream_project:
      allowed_modes:
        - bootstrap
        - operating
  repo_modes:
    bootstrap:
      purpose: discover truth and establish baseline state
    operating:
      purpose: steady-state human-in-the-loop delivery

invariants:
  - "Unknowns are preserved when the repo does not prove otherwise."
  - "Contradictions are recorded, not papered over."
  - "State files stay concise."
  - "The active queue stays short."
