[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectstate-template"
version = "6.0.0"
requires-python = ">=3.11,<3.15"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["scripts", "schemas/examples"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["fixtures", "docs/evidence", ".worktrees", ".projectstate-clones"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
