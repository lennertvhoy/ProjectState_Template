name: Validate Template Docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python3 -m pip install pytest==9.0.3 pyyaml==6.0.3 tiktoken==0.12.0

      - name: Run authoritative Level 2 validation
        run: |
          python3 scripts/statedd_quality_gate.py --gate-level 2 --conformance --verbose

      - name: Generate and self-validate every profile
        run: |
          tmpdir="$(mktemp -d)"
          for profile in $(python3 -c 'import json; print(" ".join(json.load(open("profiles/catalog.json"))["profiles"]))'); do
            profile_target="$tmpdir/profile-$profile"
            python3 scripts/init_template.py new --name "CI $profile" --profile "$profile" --target "$profile_target"
            gate_level="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["required_gate_level"])' "$profile_target/STATEDD_ASSETS.json")"
            python3 "$profile_target/scripts/statedd_quality_gate.py" --root "$profile_target" --gate-level "$gate_level" --conformance
          done

      - name: Prove validation left the checkout clean
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
