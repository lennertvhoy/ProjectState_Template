name: Validate Template Docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  branch-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the direct branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert branch-head subject identity
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "CI subject: branch-head"
          echo "Checked out: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt tiktoken==0.12.0

      - name: Run authoritative Level 2 validation
        run: |
          python3 scripts/projectstate_quality_gate.py --gate-level 2 --conformance --verbose

      - name: Generate and self-validate every profile
        run: |
          tmpdir="$(mktemp -d)"
          for profile in $(python3 -c 'import json; print(" ".join(json.load(open("profiles/catalog.json"))["profiles"]))'); do
            profile_target="$tmpdir/profile-$profile"
            python3 scripts/init_template.py new --name "CI $profile" --profile "$profile" --target "$profile_target"
            gate_level="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["required_gate_level"])' "$profile_target/PROJECTSTATE_ASSETS.json")"
            python3 "$profile_target/scripts/projectstate_quality_gate.py" --root "$profile_target" --gate-level "$gate_level" --conformance
          done

      - name: Prove validation left the checkout clean
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  merge-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the synthetic pull-request merge candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Assert merge-candidate subject identity
        env:
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_MERGE"
          echo "CI subject: PR merge-candidate"
          echo "Checked out: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt tiktoken==0.12.0

      - name: Run authoritative Level 2 validation for merge candidate
        run: python3 scripts/projectstate_quality_gate.py --gate-level 2 --conformance --verbose
