name: Validate Template Docs

# v6 only: the v5 checks live at tag v5-final.
# The "Check recorded core evidence" step runs the template's own gate. It exits 1 while the template's
# current slice is not validated, and that is intended: a red job here means the slice is not done.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  branch-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the direct branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert branch-head subject identity
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "CI subject: branch-head"
          echo "Checked out: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      # The suite imports pytest and the standard library. PyYAML (requirements-dev.txt) is only for the
      # fleet journeys, which read the owner's own repositories and do not run here.
      - name: Install test dependencies
        run: python3 -m pip install pytest==9.0.3

      - name: Exercise generated core and packaged-product journey
        run: python3 scripts/test_outcome_core.py

      - name: Check release identity
        run: python3 scripts/projectstate_release.py check

      - name: Run the test suite
        run: python3 -m pytest scripts/ -q

      - name: Check recorded core evidence
        run: python3 scripts/projectstate_gate.py

      - name: Prove validation left the checkout clean
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  merge-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the synthetic pull-request merge candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Assert merge-candidate subject identity
        env:
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_MERGE"
          echo "CI subject: PR merge-candidate"
          echo "Checked out: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python3 -m pip install pytest==9.0.3

      - name: Exercise generated core and packaged-product journey for merge candidate
        run: python3 scripts/test_outcome_core.py

      - name: Check release identity for merge candidate
        run: python3 scripts/projectstate_release.py check

      - name: Run the test suite for merge candidate
        run: python3 -m pytest scripts/ -q

      - name: Check recorded core evidence for merge candidate
        run: python3 scripts/projectstate_gate.py

      - name: Prove validation left the merge candidate clean
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
