    source:
      pull_request: 5
      review_commit: ace4f3af70d9322d50c5f5b86f8a876bda4b537d
      merged_main: c2fe7b25625cc855a47deff721251cdb5d4141b2
    scope:
      - upgrade lifecycle and managed-asset ownership
      - test-suite discovery and aggregation
      - authoritative local and CI validation entrypoint
      - initializer and upgrade path confinement
      - canonical profile and context metrics
      - exact-head evidence and closure truth
      - concise whole-template architecture review
      - controlled benchmark specification and next-slice decision
    acceptance_criteria:
      - current profile definitions determine desired future assets while old manifests remain historical ownership evidence
      - malformed manifests fail closed; local modifications and removals are reported; apply is transactional and idempotent
      - every applicable declared test suite runs; failures aggregate; unavailable declared runners fail with actionable output
      - CI and documented local validation use one authoritative automatically discovered Python suite
      - symlinked target roots, nested symlinks, absolute managed paths, traversal, unsafe source symlinks, and outside-root writes fail closed
      - one machine-readable artifact is authoritative for profile and context metrics
      - exact repaired head, evidence, PR body, remote branch, and GitHub Actions agree before closure-grade is claimed
      - architecture review records verified strengths, weaknesses, simplifications, decisions, benchmark gaps, dependency order, and non-goals only
      - exactly one next slice is selected by expected impact, cost, risk reduction, readiness, and measurability
