active_problems:
  - id: BL-GIT-ISOLATION-001
    title: Git metadata safety and isolation boundary can fail open
    severity: P0
    status: open
    opened_at: 2026-07-11T14:15:33+02:00
    incident: docs/incidents/20260711-141533-git-object-ownership-permission.md
    failure_scan: docs/failure_scans/BL-GIT-ISOLATION-001.md
    initiating_cause:
      status: reported
      boundary: external_runtime
      summary: surrounding runtime reportedly changed nested shared Git metadata ownership or permissions
      actor_command_timestamp: not_proven
    statedd_causal_contribution:
      status: observed
      boundary: workflow_integrity
      summary: StateDD did not detect, contain, or fail closed on the unsafe shared Git common directory
    truth_boundaries:
      local_worktree: observed_clean_at_intake
      git_common_directory: observed_shared_by_six_worktrees
      runtime_actor: not_proven
      local_implementation: not_started
      remote_branch: not_proven_for_repair
      ci: not_proven_for_repair
      user_accepted: false
    acceptance_criteria:
      - centralized schema-valid Git safety preflight proves identity, metadata safety, fsck, synchronization, and isolation mode
      - worktree mode is explicit opt-in and blocked for containers, privileged runtimes, or unknown/mismatched identity
      - clone mode proves an independent common directory without alternates or hardlinked objects
      - mandatory Git failure latches StateDD-managed mutation read-only until repaired and explicitly restarted
      - no automatic permission repair, destructive reset or clean, garbage collection, prune, or force cleanup production path remains
      - exact-event and adjacent regressions pass on the same pushed head as final GitHub Actions and remote closure
