    mode: bootstrap
    summary: |
      This repository starts in bootstrap mode. Do not switch to operating mode
      until the project truth, backlog, active queue, runtime identity, and
      evidence baseline have been established.

  project:
    name: Your Project
    type: unknown
    lifecycle_stage: bootstrap
    truth_summary: bootstrap_initializing

  runtime_identity:
    status: unknown
    repo_path: unknown
    branch: null
    head: null
    process_or_container: unknown
    port_or_base_url: unknown
    rebuilt_in_current_slice: unknown
    duplicate_runtimes_checked: false
