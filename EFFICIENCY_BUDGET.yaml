schema: projectstate.efficiency_budget.v1
instruction_budgets:
  root_agents_max_lines: 110
  nested_agents_max_lines: 80
  skill_max_lines: 180
  command_max_lines: 120
  prompt_max_lines: 200
  duplicate_instruction_max_lines: 5
  max_steps_per_workflow: 9

state_budgets:
  active_next_actions_max: 5
  active_backlog_items_max: 12
  final_handoff_max_lines: 80

context_budgets:
  token_estimator: utf8_bytes_div_4_ceiling
  startup_files:
    - AGENTS.md
    - STATUS.md
    - PROJECT_STATE.yaml
    - NEXT_ACTIONS.md
  selection_policies:
    initial_orientation:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
    normal_implementation:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - scripts/AGENTS.md
    interrupted_resume:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
    closure_review:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - prompts/EVIDENCE_README_TEMPLATE.md
    ci_diagnosis:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - .github/workflows/validate.yml
      - scripts/projectstate_quality_gate.py
    architecture_audit:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - PROJECT_DNA.yaml
      - EFFICIENCY_BUDGET.yaml
      - profiles/catalog.json
  profiles:
    template_repository:
      max_startup_files: 5
      max_startup_bytes: 40000
      max_startup_estimated_tokens: 10000
      # Includes the optional OKF validator, extension schema, and contained scaffold.
      # Includes the committed OKF evidence/state finalization surface; keep
      # this above the measured full-template footprint without changing
      # ordinary startup selection.
      # The final operational slice adds typed finish/post-merge implementations,
      # their schemas/tests, and one proportional evidence pack. Measured before
      # evidence finalization at 2,359,582 bytes. The managed workspace lifecycle
      # incident adds one inventory helper, one receipt schema, focused regressions,
      # and proportional incident evidence; measured at 2,482,405 bytes.
      # Durable remote-closure receipt and state-reconciliation proof add four
      # evidence files; measured at 339 files and 2,510,361 bytes.
      # The StateDD -> ProjectState rename adds 33 backward-compat script shims,
      # 7 command alias files, schema enum aliases, and a manifest resolver;
      # measured at 381 files and 2,586,862 bytes.
      # The autonomous improvement workflow (BL-AUTONOMY-001) adds the improve
      # skill, /projectstate-improve command, and one closure evidence pack with
      # an external-receipt copy; measured at 2,643,416 bytes before receipt
      # compaction.
      # BL-WORKFLOW-CATALOG-001 adds the workflows-catalog evidence pack;
      # BL-IMPROVE-RUN-001 adds its reconciliation pack: measured at
      # 2,663,686 bytes combined.
      # BL-STATEISOLATION-001 adds its defect-repair evidence pack (README,
      # runtime identity, gate output, before/after repro artifacts);
      # measured at 404 files and 2,682,517 bytes before the pack absorbed
      # its own verbose gate transcript (peak measured 2,708,119 bytes).
      # BL-STATEISOLATION-002 records the closure receipt in a small
      # reconciliation pack; measured at 409 files and 2,701,500 bytes.
      max_footprint_files: 410
      max_footprint_bytes: 2740000
    minimal:
      max_startup_files: 5
      max_startup_bytes: 9000
      max_startup_estimated_tokens: 2250
      max_footprint_files: 44
      # Optional knowledge_okf adds the validator, extension schema, and one
      # contained index without changing the startup file selection.
      # Measured at 397,864 bytes with optional knowledge_okf installed.
      # After ProjectState rename: measured at 424,112 bytes with optional knowledge_okf.
      # BL-WORKFLOW-CATALOG-001 adds the improve skill and /projectstate-improve
      # command (+2 files, +7,459 bytes): 431,571 bytes with optional knowledge_okf.
      max_footprint_bytes: 440000
    solo:
      max_startup_files: 5
      max_startup_bytes: 10000
      max_startup_estimated_tokens: 2500
      max_footprint_files: 78
      # Measured at 763,265 bytes with optional knowledge_okf installed.
      # After ProjectState rename: measured at 775,688 bytes.
      # BL-WORKFLOW-CATALOG-001 adds +2 files (+7,459 bytes); measured with
      # optional knowledge_okf at 790,739 bytes.
      max_footprint_bytes: 800000
    team:
      max_startup_files: 5
      max_startup_bytes: 10500
      max_startup_estimated_tokens: 2625
      # Includes strict runtime-truth, Git-safety, structured bootstrap, and
      # exact-head collaboration controls required by the agent-first contract.
      max_footprint_files: 92
      # Measured at 986,599 bytes with finish/post-merge controls and optional OKF.
      # After ProjectState rename (schema enum aliases, manifest resolver,
      # env-var fallbacks): measured at 1,041,807 bytes.
      # BL-WORKFLOW-CATALOG-001 adds +2 files, +7,459 bytes: 1,049,266 bytes.
      max_footprint_bytes: 1060000
    regulated:
      max_startup_files: 5
      max_startup_bytes: 11000
      max_startup_estimated_tokens: 2750
      # BL-WORKFLOW-CATALOG-001 adds +2 files.
      max_footprint_files: 94
      # Measured at 987,047 bytes with inherited finish controls and optional OKF.
      # After ProjectState rename: measured at 1,042,220 bytes.
      # BL-WORKFLOW-CATALOG-001 adds +2 files, +7,459 bytes: 1,049,679 bytes.
      max_footprint_bytes: 1060000

evidence_budgets:
  default_max_files: 15
  docs_only_max_files: 2
  runtime_change_min_files: 2
  runtime_change_max_files: 8

gate_budgets:
  edit_loop_target_seconds: 30
  closure_gate_target_seconds: 180
  release_gate_target_seconds: 600

anti_bloat_rules:
  no_duplicate_instruction_files: true
  no_more_than_one_canonical_source: true
  no_unreferenced_skills: true
  no_unbounded_evidence_dumps: true
  no_full_repo_audit_for_single_file_edit: true
