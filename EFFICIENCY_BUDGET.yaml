schema: statedd.efficiency_budget.v1
instruction_budgets:
  root_agents_max_lines: 110
  nested_agents_max_lines: 80
  skill_max_lines: 180
  command_max_lines: 120
  prompt_max_lines: 200
  duplicate_instruction_max_lines: 5
  max_steps_per_workflow: 9

state_budgets:
  active_next_actions_max: 5
  active_backlog_items_max: 12
  final_handoff_max_lines: 80

context_budgets:
  token_estimator: utf8_bytes_div_4_ceiling
  startup_files:
    - AGENTS.md
    - STATUS.md
    - PROJECT_STATE.yaml
    - NEXT_ACTIONS.md
  selection_policies:
    initial_orientation:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
    normal_implementation:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - scripts/AGENTS.md
    interrupted_resume:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
    closure_review:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - prompts/EVIDENCE_README_TEMPLATE.md
    ci_diagnosis:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - .github/workflows/validate.yml
      - scripts/statedd_quality_gate.py
    architecture_audit:
      - AGENTS.md
      - STATUS.md
      - NEXT_ACTIONS.md
      - PROJECT_STATE.yaml
      - PROJECT_DNA.yaml
      - EFFICIENCY_BUDGET.yaml
      - profiles/catalog.json
  profiles:
    template_repository:
      max_startup_files: 5
      max_startup_bytes: 40000
      max_startup_estimated_tokens: 10000
      max_footprint_files: 330
      # Includes the optional OKF validator, extension schema, and contained scaffold.
      max_footprint_bytes: 2100000
    minimal:
      max_startup_files: 5
      max_startup_bytes: 9000
      max_startup_estimated_tokens: 2250
      max_footprint_files: 42
      # Optional knowledge_okf adds the validator, extension schema, and one
      # contained index without changing the startup file selection.
      max_footprint_bytes: 380000
    solo:
      max_startup_files: 5
      max_startup_bytes: 10000
      max_startup_estimated_tokens: 2500
      max_footprint_files: 76
      max_footprint_bytes: 730000
    team:
      max_startup_files: 5
      max_startup_bytes: 10500
      max_startup_estimated_tokens: 2625
      # Includes strict runtime-truth, Git-safety, structured bootstrap, and
      # exact-head collaboration controls required by the agent-first contract.
      max_footprint_files: 90
      max_footprint_bytes: 850000
    regulated:
      max_startup_files: 5
      max_startup_bytes: 11000
      max_startup_estimated_tokens: 2750
      max_footprint_files: 92
      max_footprint_bytes: 900000

evidence_budgets:
  default_max_files: 15
  docs_only_max_files: 2
  runtime_change_min_files: 2
  runtime_change_max_files: 8

gate_budgets:
  edit_loop_target_seconds: 30
  closure_gate_target_seconds: 180
  release_gate_target_seconds: 600

anti_bloat_rules:
  no_duplicate_instruction_files: true
  no_more_than_one_canonical_source: true
  no_unreferenced_skills: true
  no_unbounded_evidence_dumps: true
  no_full_repo_audit_for_single_file_edit: true
