schema: statedd.efficiency_budget.v1
instruction_budgets:
  root_agents_max_lines: 110
  nested_agents_max_lines: 80
  skill_max_lines: 180
  command_max_lines: 120
  prompt_max_lines: 200
  duplicate_instruction_max_lines: 5
  max_steps_per_workflow: 9

state_budgets:
  active_next_actions_max: 5
  active_backlog_items_max: 12
  final_handoff_max_lines: 80

context_budgets:
  token_estimator: utf8_bytes_div_4_ceiling
  startup_files:
    - AGENTS.md
    - STATUS.md
    - PROJECT_STATE.yaml
    - PROJECT_DNA.yaml
    - NEXT_ACTIONS.md
  profiles:
    template_repository:
      max_startup_files: 5
      max_startup_bytes: 41000
      max_startup_estimated_tokens: 10250
      max_footprint_files: 330
      max_footprint_bytes: 1800000
    minimal:
      max_startup_files: 5
      max_startup_bytes: 10500
      max_startup_estimated_tokens: 2625
      max_footprint_files: 32
      max_footprint_bytes: 237000
    solo:
      max_startup_files: 5
      max_startup_bytes: 10500
      max_startup_estimated_tokens: 2625
      max_footprint_files: 66
      max_footprint_bytes: 530000
    team:
      max_startup_files: 5
      max_startup_bytes: 11500
      max_startup_estimated_tokens: 2875
      max_footprint_files: 75
      max_footprint_bytes: 700000
    regulated:
      max_startup_files: 5
      max_startup_bytes: 12000
      max_startup_estimated_tokens: 3000
      max_footprint_files: 75
      max_footprint_bytes: 760000

evidence_budgets:
  default_max_files: 15
  docs_only_max_files: 2
  runtime_change_min_files: 2
  runtime_change_max_files: 8

gate_budgets:
  edit_loop_target_seconds: 30
  closure_gate_target_seconds: 180
  release_gate_target_seconds: 600

anti_bloat_rules:
  no_duplicate_instruction_files: true
  no_more_than_one_canonical_source: true
  no_unreferenced_skills: true
  no_unbounded_evidence_dumps: true
  no_full_repo_audit_for_single_file_edit: true
